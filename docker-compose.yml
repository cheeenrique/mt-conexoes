# Nome do projeto fixo: sem isto o Docker deriva do diretório, e cada worktree
# ("etapa-0-fundacao", "etapa-2-cobranca"...) cria um volume próprio — foi como
# o banco de dev acabou vivendo em `etapa-0-fundacao_mt-conexoes-db-data`.
name: mt-conexoes

services:
  db:
    image: postgres:16-alpine
    container_name: mt-conexoes-db
    environment:
      POSTGRES_USER: mtconexoes
      POSTGRES_PASSWORD: mtconexoes
      POSTGRES_DB: mtconexoes
    ports:
      - "5442:5432" # host 5432 is commonly taken by other local projects; container stays on 5432
    volumes:
      - mt-conexoes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtconexoes -d mtconexoes"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Banco de integração, isolado do de dev (`db`). pnpm test:integration afirma
  # totais globais (getMonthlySummary, getSupplierBreakdown) — semear dado de
  # demonstração aqui derrubaria essas suítes de forma não determinística.
  # Nunca rodar prisma/seed-demo.ts contra este serviço.
  db-test:
    image: postgres:16-alpine
    container_name: mt-conexoes-db-test
    environment:
      POSTGRES_USER: mtconexoes
      POSTGRES_PASSWORD: mtconexoes
      POSTGRES_DB: mtconexoes
    ports:
      - "5443:5432"
    volumes:
      - mt-conexoes-db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtconexoes -d mtconexoes"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Simula o Cloud Scheduler batendo nas rotas de cron. Não sobe junto com o
  # banco: `docker compose up -d db` deixa este parado de propósito, porque ele
  # depende do `pnpm dev` estar no ar. Ligue com `docker compose --profile cron
  # up -d cron-sim` quando quiser ver a régua rodando sozinha.
  #
  # ⚠️ A lista precisa cobrir as QUATRO rotas. Ela ficou meses com só `ping` e
  # `charges-mark-overdue`, deixando de fora justamente `dunning-evaluate` e
  # `messages-dispatch` — o motor da régua e o despacho, que são o que o produto
  # faz. Subir o simulador sem elas dá a impressão de que o agendamento está
  # coberto quando o essencial nunca é chamado.
  cron-sim:
    image: node:20-alpine
    container_name: mt-conexoes-cron-sim
    profiles: ["cron"]
    depends_on:
      - db
    environment:
      APP_URL: http://host.docker.internal:3000
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret}
      CRON_ENDPOINTS: /api/cron/ping,/api/cron/charges-mark-overdue,/api/cron/dunning-evaluate,/api/cron/messages-dispatch
      INTERVAL_SECONDS: "60"
    volumes:
      - ./docker/cron-sim/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]

volumes:
  mt-conexoes-db-data:
  mt-conexoes-db-test-data:
