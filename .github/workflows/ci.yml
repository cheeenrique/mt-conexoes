name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Push seguido de push na mesma branch cancela a execução anterior — o que vale
# é o estado final, e o job de integração segura um Postgres por execução.
#
# ⚠️ Em `main`, não. Lá a execução termina em `prisma migrate deploy`, e matar
# o processo no meio de uma migration deixa o banco num estado que exige
# intervenção à mão. Fila em vez de cancelamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Valores de brinquedo. Os módulos exigem que a variável exista (requireEnv,
# CREDENTIAL_KEY de 32 bytes) e falham no import sem ela — nenhum destes
# valores é usado contra serviço real, e nenhum segredo de produção entra aqui.
env:
  CREDENTIAL_KEY: Q0hBTkdFLU1FLWRldi1jcmVkZW50aWFsLWtleS0zMmI=
  SESSION_SECRET: ci-session-secret-32-bytes-minimo-ok
  CRON_SECRET: ci-cron-secret
  META_WEBHOOK_VERIFY_TOKEN: ci-meta-webhook-verify-token
  APP_URL: http://localhost:3000

jobs:
  checks:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node 20 espelha o Dockerfile (node:20-alpine). Testar numa versão e
      # publicar em outra é como um bug de runtime chega em produção verde.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `next build` e o typecheck precisam dos tipos do Prisma Client, que não
      # estão versionados.
      - run: pnpm exec prisma generate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Todas as 26 rotas são dinâmicas — o build não abre conexão com o banco.
      - run: pnpm build

  integration:
    name: integração (Postgres real)
    runs-on: ubuntu-latest

    # Índice parcial e CHECK não existem em SQLite, e são justamente eles que
    # garantem a dedupe diária e a unicidade da cobrança. Postgres de verdade
    # ou o teste não vale nada. Ver .claude/rules/06-testes.md.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mtconexoes
          POSTGRES_PASSWORD: mtconexoes
          POSTGRES_DB: mtconexoes
        ports:
          - 5443:5432
        options: >-
          --health-cmd "pg_isready -U mtconexoes -d mtconexoes"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # A porta 5443 espelha o serviço db-test do docker-compose, pra receita
      # local e a de CI serem a mesma. TEST_DATABASE_URL (e não DATABASE_URL)
      # porque tests/setup-integration.ts avisa e degrada se só achar a de dev.
      TEST_DATABASE_URL: postgresql://mtconexoes:mtconexoes@localhost:5443/mtconexoes

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate

      # Mesmo script do fluxo local — aponta DATABASE_URL para TEST_DATABASE_URL
      # sem tocar no de dev.
      - run: pnpm db:migrate:test

      - run: pnpm test:integration

  deploy:
    name: build · migrate · deploy (Cloud Run)
    needs: [checks, integration]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # Dois deploys sobrepostos rodariam duas migrations ao mesmo tempo. Fila.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write        # exigido pela federação — é o que gera o token OIDC

    env:
      PROJECT_ID: mt-conexoes
      REGION: southamerica-east1
      SERVICE: painel
      AR_REPO: painel

    steps:
      - uses: actions/checkout@v4

      # Sem chave JSON: o runner troca o próprio token OIDC por credencial de
      # curta duração. Ver scripts/gcp/70-github-wif.sh.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate

      # O provisionamento (00 a 50) monta service account, segredos e variáveis
      # de ambiente. Este workflow só troca a imagem — se o serviço ainda não
      # existe, um `run deploy` daqui criaria um painel sem nada disso.
      - name: exigir serviço já provisionado
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" >/dev/null \
            || { echo "::error::serviço '$SERVICE' não existe. Rode scripts/gcp/00..50 antes do primeiro deploy pelo CI."; exit 1; }

      # Build no runner, não no Cloud Build: o runner do GitHub já está pago no
      # plano da conta e o Cloud Build cobra por minuto acima da cota diária.
      # O runner é amd64, mesma arquitetura do Cloud Run.
      - name: build e push da imagem
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${GITHUB_SHA::7}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Antes do deploy, não depois: migration nova tem que ser compatível com o
      # código que ainda está no ar (expand/contract). Ao contrário, o código
      # novo sobe e encontra um schema que ainda não existe.
      - name: migrations e defaults
        env:
          SEED_USER_EMAIL: ${{ secrets.SEED_USER_EMAIL }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest --secret DATABASE_URL --project "$PROJECT_ID")"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          pnpm exec prisma migrate deploy
          # Defaults do sistema: usuário do painel, singleton de settings e a
          # régua padrão com os 6 passos. Idempotente — não sobrescreve senha
          # trocada em /conta nem passo de régua já editado.
          if [[ -z "$SEED_USER_EMAIL" || -z "$SEED_USER_PASSWORD" ]]; then
            echo "seed pulado: SEED_USER_EMAIL/SEED_USER_PASSWORD não configurados nos secrets do repositório."
            echo "⚠️ sem eles o seed geraria uma senha aleatória e a imprimiria neste log."
          else
            pnpm exec tsx prisma/seed.ts
          fi

      # Só --image: qualquer outra flag aqui sobrescreveria em silêncio o que
      # 30-deploy.sh configurou (APP_URL, CRON_OIDC_AUDIENCE, segredos, SA).
      - name: deploy
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" \
            --region "$REGION" --project "$PROJECT_ID" --quiet

      - name: fumaça
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$URL/api/health" >/dev/null
          echo "no ar: $URL"
